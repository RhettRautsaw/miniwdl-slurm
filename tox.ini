[tox]

[testenv:unit]
commands =
    python -m unittest discover -s tests -p test_*.py

[testenv:twine_check]
deps=build
     twine
skip_install=True
commands =
    python -m build
    twine check dist/*

[testenv:lint]
deps=flake8
     flake8-import-order
     mypy
commands =
    flake8 src
    mypy src

[flake8]
max-line-length = 88
